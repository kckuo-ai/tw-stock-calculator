name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials
        id: cred
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::notice title=deploy::尚未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，略過部署"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.cred.outputs.ok == 'true'
        with:
          node-version: "22"
      - name: Deploy to Cloudflare
        if: steps.cred.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if ! npx -y wrangler@4 deploy 2>&1 | tee deploy.log; then
            grep -vE '^\s*$' deploy.log | tail -15 | while IFS= read -r l; do echo "::error title=wrangler::${l:0:300}"; done
            exit 1
          fi
          grep -E 'Uploaded|Deployed|https://' deploy.log | while IFS= read -r l; do echo "::notice title=wrangler::${l:0:300}"; done
      - name: Verify
        if: steps.cred.outputs.ok == 'true'
        run: |
          sleep 10
          W=https://tw-quote.kuochen-kuo.workers.dev
          ver=$(curl -sS -m 30 -D - -o body.json -H "Origin: https://kckuo-ai.github.io" "$W/?code=2330" | grep -i '^x-worker-version' | tr -d '\r' | awk '{print $2}')
          px=$(python3 -c "import json;d=json.load(open('body.json'));x=d['msgArray'][0];print(x['n'],x.get('z'),x.get('d'),x.get('t'))")
          other=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" -H "Origin: https://evil.example" "$W/?code=2330")
          echo "::notice title=verify::version=$ver | 2330: $px | other-origin=$other"
          test "$ver" = "$(grep -oP "VERSION = '\K[^']+" worker/worker.js)"
