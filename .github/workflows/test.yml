name: Test

on:
  push:
    branches: [main]
    paths:
      - "calc.js"
      - "tests/**"
      - "scripts/update_quotes.py"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.js
      - run: python3 -m py_compile scripts/update_quotes.py
