name: Test worker
on:
  push:
    paths: [".github/workflows/test-worker.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W=https://tw-quote.kuochen-kuo.workers.dev
          for c in 2330 0050 00981A; do
            s=$(date +%s.%N)
            body=$(curl -sS -m 30 -H "Origin: https://kckuo-ai.github.io" "$W/?code=$c")
            e=$(date +%s.%N)
            raw=$(echo "$body" | python3 -c "import json,sys;d=json.load(sys.stdin);x=[i for i in d['msgArray'] if i.get('n')][0];print({k:x.get(k) for k in ['z','pz','b','a','g','f','y','o','h','l','v','t','tlong','ts','ip']})")
            echo "::notice title=$c $(python3 -c "print(round($e-$s,2))")s::$raw"
          done
          # 直接打 MIS（不經 Worker）比較延遲
          s=$(date +%s.%N); curl -sS -m 30 -o /dev/null "https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_2330.tw&json=1&delay=0"; e=$(date +%s.%N)
          echo "::notice title=direct MIS::$(python3 -c "print(round($e-$s,2))")s"
