name: Test worker
on:
  push:
    paths: [".github/workflows/test-worker.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W=https://tw-quote.kuochen-kuo.workers.dev
          for c in 0050 2330; do
            raw=$(curl -sS -m 30 -H "Origin: https://kckuo-ai.github.io" "$W/?code=$c" | python3 -c "import json,sys;d=json.load(sys.stdin);x=[i for i in d['msgArray'] if i.get('n')][0];print({k:x.get(k) for k in ['z','pz','b','a','y','o','h','l','v','d','t']})")
            echo "::notice title=raw $c::$raw"
          done
          npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 390, height: 844 } });
          await p.goto('https://kckuo-ai.github.io/tw-stock-calculator/?v=' + Date.now(), { waitUntil: 'networkidle' });
          const out = [];
          for (const code of ['0050', '2330']) {
            await p.fill('#code', code); await p.click('#go'); await p.waitForTimeout(6000);
            out.push(code + ' || ' + await p.evaluate(() => [document.querySelector('#qPrice').textContent, document.querySelector('#msg').textContent || '-', document.querySelector('#qMeta').innerText.replace(/\n/g, ' '), document.querySelector('#buy').value, document.querySelector('footer').innerText.split('\n').pop()].join(' | ')));
          }
          console.log(out.join('\n')); await b.close();
          JS
          node t.mjs > out.txt 2>&1 || true
          while IFS= read -r line; do echo "::notice title=page::${line:0:400}"; done < out.txt
