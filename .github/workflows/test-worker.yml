name: Test worker
on:
  push:
    paths: [".github/workflows/test-worker.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          W=https://tw-quote.kuochen-kuo.workers.dev
          for c in 2330 00981A 6488 9999; do
            echo "== $c"; curl -sS -m 20 -D - -H "Origin: https://kckuo-ai.github.io" "$W/?code=$c" | grep -iE "^HTTP|access-control|\"(c|n|z|y|o|h|l|d|t)\":|msgArray|error" | head -20
            curl -sS -m 20 -H "Origin: https://kckuo-ai.github.io" "$W/?code=$c" | python3 -c "import json,sys;d=json.load(sys.stdin);[print({k:x.get(k) for k in 'c n z y o h l v d t ex'.split()}) for x in d.get('msgArray',[])];print('error' in d and d)"
          done
          echo "== other origin"; curl -sS -m 20 -o /dev/null -w "%{http_code}\n" -H "Origin: https://evil.example" "$W/?code=2330"
          echo "== timing"; for i in 1 2 3; do curl -sS -m 20 -o /dev/null -w "%{time_total}\n" -H "Origin: https://kckuo-ai.github.io" "$W/?code=2330"; done
